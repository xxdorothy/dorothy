# vim:set expandtab shiftwidth=4 filetype=toml:
# SPDX-License-Identifier: GPL-3.0-only

#
#
# ~xxdorothy/dorothy.git
# ::: :/.config/mise/config.toml
#
#

#
# Sourced during CI by GitHub Action `jdx/mise-action`
# https://mise.jdx.dev/configuration.html
#

# ----------
# Intrinsic
# ----------

min_version = "2026.11.6"

# ------
# Tools
# ------

[tools]
# Javascript/TypeScript Runtime
bun = "1.4"

# Pi runs under Node >= 22.19
node = "24"

# Utilities
"aqua:jqlang/jq" = "1"  # statusline, check-secrets

# -----------------------
# Tools: Lint and Format
# -----------------------

# editorconfig
"aqua:editorconfig-checker/editorconfig-checker" = "4.0.2"

# TOML
"aqua:tombi-toml/tombi" = "1.11.3"

# Shell
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh"            = "3.14.1"

# Secrets
"aqua:getsops/sops"    = "3.13.3"
"aqua:FiloSottile/age" = "1.3.2"

# YAML
"aqua:astral-sh/uv" = "0.12.19"
"pypi:yamllint"     = "1.38.0"

# Evidence packaging streams GNU tar (Linux system prerequisite) through zstd.
"conda:zstd" = { version = "1.5.7", channel = "conda-forge" }

# GitHub Actions
"aqua:rhysd/actionlint" = "1.7.12"

# Git hooks and the lint and format steps
"aqua:jdx/hk" = "2.14.0"

# ---------
# Settings
# ---------

[settings]
experimental = true  # the git:: remote task needs it

# Installs the packages hk.pkl imports, then the git hooks. CI installs
# its own packages and needs no hooks.
[[hooks.postinstall]]
run = 'test -n "${CI-}" || { bun ci && hk install --mise; }'

# ------------
# Environment
# ------------

[env]
# A change to shared configuration can change the result for any file, so
# it widens lint and format to every file. Not packages/: it is the code.
CGXX_WIDEN_ON = "bun.lock .config .biome.json .editorconfig .markdownlint-cli2.jsonc .shellcheckrc"

# ------
# Tasks
# ------

[task_config]
includes = [ ".config/mise/tasks/*.task.toml" ]
