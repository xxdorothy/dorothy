# vim:set expandtab shiftwidth=4 filetype=toml:
# SPDX-License-Identifier: GPL-3.0-only
#:schema https://mise.jdx.dev/schema/mise-task.json

#
#
# ~xxdorothy/dorothy.git
# ::: :/.config/mise/tasks/standard.task.toml
#
#

#
# The standard set, each extending a cgxx: template from
# @chewygumxx/mise-tasks-config, linked into .config/mise/conf.d/. lint and
# format run the steps of .config/hk.pkl through hk, quietly: changed files
# by default, --staged or --all otherwise, one step with --step.
# https://mise.jdx.dev/tasks/task-configuration.html
#

[install]
extends = "cgxx:install"

[lint]
extends = "cgxx:lint"

[format]
extends = "cgxx:format"

[test]
extends = "cgxx:test"

[check]
extends = "cgxx:check"

[commit]
extends = "cgxx:commit"

["commit:lint"]
extends = "cgxx:commit:lint"
alias   = "lint:commit"

[act]
extends = "cgxx:act"
